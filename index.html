<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE 262 | Clean Routine Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @media print { .print-hidden { display: none !important; } body { background: white; color: black; } }
        
        /* Smooth transition for the floating bar */
        #action-bar {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-[110] transform translate-x-full transition-transform duration-300 bg-indigo-600 text-white px-6 py-3 rounded-xl shadow-2xl text-xs font-bold pointer-events-none"></div>

    <!-- Header -->
    <header class="relative bg-gradient-to-r from-indigo-950 via-slate-900 to-slate-950 border-b border-indigo-950 px-4 py-10 sm:px-8 shadow-2xl print-hidden">
        <div class="relative max-w-7xl mx-auto text-center md:text-left">
            <div class="inline-flex items-center space-x-2 bg-indigo-500/10 border border-indigo-400/20 px-3.5 py-1 rounded-full text-indigo-300 text-[10px] font-bold uppercase tracking-widest mb-3">
                ⚡ EEE 262 BATCH
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">EEE Routine Portal</h1>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6 flex-grow pb-24">

        <!-- NAVIGATION FILTERS -->
        <section class="bg-slate-900 border border-slate-900 rounded-3xl shadow-xl p-6 space-y-6 print-hidden">
            <div>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-3">📅 Select Weekday:</span>
                <div id="day-filters" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="pt-6 border-t border-slate-800">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-3">👥 Select Section:</span>
                <div id="section-filters" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <!-- ROUTINE DISPLAY -->
        <div id="routine-container"></div>

    </main>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 z-[100] hidden bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 print-hidden">
        <div class="bg-slate-900 border border-indigo-500/30 rounded-3xl w-full max-w-4xl p-6 shadow-2xl overflow-y-auto max-h-[90vh] animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-indigo-400">🛠️ Editor Dashboard</h2>
                <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <form id="routine-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <select id="f-day" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <select id="f-time" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <input id="f-course" type="text" placeholder="Course Code" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required>
                <select id="f-section" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <select id="f-teacher" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <input id="f-room" type="text" placeholder="Room Number" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required>
                <select id="f-type" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500">
                    <option value="Theory">Theory Class</option>
                    <option value="Lab">Lab Practical</option>
                </select>
                <button type="submit" class="bg-emerald-600 text-white font-bold rounded-xl py-3 shadow-lg">Add Slot</button>
            </form>
            <div class="mt-8 pt-6 border-t border-slate-800 flex gap-4">
                <button onclick="clearRoutine()" class="text-rose-400 text-[10px] font-bold uppercase">🗑️ Erase Data</button>
                <button onclick="copyData()" class="text-slate-400 text-[10px] font-bold uppercase">📋 Copy Code</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM DIALOG MODAL (REPLACEMENT FOR BROWSER PROMPT/CONFIRM/ALERT) -->
    <div id="custom-dialog-container" class="fixed inset-0 z-[200] hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-indigo-500/30 rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center space-y-4 animate-fade-in">
            <div id="dialog-icon" class="text-3xl">🔑</div>
            <h3 id="dialog-title" class="text-md font-bold text-slate-200">System Security</h3>
            <p id="dialog-message" class="text-xs text-slate-400">Please authenticate to continue.</p>
            <input id="dialog-input" type="password" class="hidden w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-center text-white outline-none focus:ring-1 ring-indigo-500 mb-2" placeholder="••••••••">
            <div class="flex gap-3 justify-center">
                <button id="dialog-cancel-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-4 py-2 rounded-xl">Cancel</button>
                <button id="dialog-confirm-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Confirm</button>
            </div>
        </div>
    </div>

    <!-- FLOATING ACTION BAR (SCROLL TO HIDE) -->
    <div id="action-bar" class="fixed bottom-0 left-0 w-full p-6 flex justify-center gap-4 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent print-hidden z-[90]">
        <button id="open-editor-btn" onclick="openAdminPanel()" class="hidden bg-indigo-600 text-white px-8 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2">
            <span>➕ Open Editor</span>
        </button>
        <button onclick="handleAdminAuth()" id="admin-toggle-btn" class="bg-slate-900/90 backdrop-blur border border-slate-800 text-slate-400 hover:text-white px-8 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2">
            <span id="login-text">🔒 Admin Login</span>
        </button>
    </div>

    <!-- FOOTER SECTION -->
     <footer class="w-full text-center py-6 border-t border-slate-900 text-slate-600 text-xs font-bold tracking-widest uppercase print-hidden mt-auto">
     <p className="text-[10px] text-slate-600 font-bold uppercase tracking-[0.1em]">
          Powered by <a href="https://khpartho623.github.io/me/" target="_blank" rel="noopener noreferrer" className="text-indigo-400 hover:text-indigo-300 transition-colors">Md. Kamrul Hasan</a>
        </p>
        <p className="mt-4 text-[10px] text-slate-500 font-bold uppercase tracking-[0.3em] opacity-50">
          @2026 EEE Routine Portal. All rights reserved.
        </p>
    </footer>

    <script>
        // --- CONSTANTS ---
        const DAYS = ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
        const TIMES = ["8:30-9:30", "9:30-10:30", "10:30-11:30", "11:30-12:30", "1:00-2:00", "2:00-3:00", "3:00-4:00", "4:00-5:00", "5:00-6:00"];
        const SECTIONS = ["1-1 A", "1-1 B", "1-1 C", "1-1 D", "1-1 E", "1-1 F"];
        const TEACHERS = {
  MSA: "Dr. M. Shamsul Alam",
  MRK: "Dr. Mohammad Rezaul Karim",
  DAM: "Dr. Md. Alam Hossain Mondal",
  MFI: "Dr. Md. Fokhrul Islam",
  DAS: "Md. Dara Abdus Satter",
  DRA: "Dr. Md. Rezwanul Ahsan",
  SRC: "Dr. Srimanti Roy Choudhury",
  DTF: "Dr. Tama Fouzder",
  FHT: "Dr. Fahmida Hossain Tithi",
  MAH: "Dr. Md. Ashraful Haque",
  SR: "Md. Sohel Rana",
  SD: "Sutapa Debnath",
  MR: "Md. Rokanuzzaman",
  MSH: "Md. Sanowar Hosen",
  MRA: "Md. Ramjan Ali",
  NR: "Naimur Rahman",
  SH: "Sagor Hazra",
  SRH: "Syeda Rukaiya Hossain",
  SDN: "Sujoy Devnath",
  SAT: "Mir Sabrina Alam",
  MNA: "Musanna Afrin",
  AI: "Ahmed Imtiaz",
  PA: "Pritom Aich",
  HRP: "Md. Hasibur Rahaman Peash",
  RP: "Md. Rasel Parvez",
  NH: "Nayeb Hasin",
  AKB: "Anjan Kumar Bagchi",
  SP: "Sudipto Pramanik",
  BS: "Bijoy Sorker",
  IJM: "Isfat Jahan Maria",
  TRS: "Tara Rani Sarkar",
  SS: "Sarna Sarker",
  JA: "Junayed Ahmmad",
  DB: "Diponkar Bhowmik",
  KMT: "Kazi Mubashir Tazwar",
  TA: "Tousif Ansari",
  KNA: "Khondaker Nafis Ahmed",
  AAA: "Anan Afsana Azad",
  MMR: "Md. Mahtabur Rahman",
  ZK: "Md. Zakaria Khan",
  ShA: "Dr. Md. Shahin Azad",
  SHS: "Sayeed Hossain Sayor",
  SMP: "Sumaiya Parvin",
  AB: "Anik Biswas",
  RIR: "Md. Rakibul Islam Rakib",
  SKS: "Safia Khan Sara",
  MW: "Md. Wahiduzzaman",
  JMT: "Juhayer Mahtab Tasin",
  SkH: "Mohammad Sakib Hossain",
  MAR: "Maksuda Akter Rubi",
  MTC: "Maliha Taslima Chowdhury",
  AS: "Abhirup Sarker"
};

        // --- STATE ---
        let isAdmin = false;
        let activeDay = "Saturday";
        let activeSection = "1-1 A";
        let routine = JSON.parse(localStorage.getItem('eee_v6_data')) || [];

        // --- SCROLL LOGIC ---
        window.addEventListener('scroll', () => {
            const actionBar = document.getElementById('action-bar');
            if (window.scrollY > 50) {
                // User is scrolling down - HIDE
                actionBar.classList.add('translate-y-32', 'opacity-0');
                actionBar.classList.remove('translate-y-0', 'opacity-100');
            } else {
                // User is at top - SHOW
                actionBar.classList.remove('translate-y-32', 'opacity-0');
                actionBar.classList.add('translate-y-0', 'opacity-100');
            }
        });

        // --- CUSTOM MODERN DIALOG ENGINES (Replaces native blocking Prompt/Confirm/Alert) ---
        function customPrompt(message, isPassword = false) {
            return new Promise((resolve) => {
                const container = document.getElementById('custom-dialog-container');
                const title = document.getElementById('dialog-title');
                const msg = document.getElementById('dialog-message');
                const input = document.getElementById('dialog-input');
                const cancelBtn = document.getElementById('dialog-cancel-btn');
                const confirmBtn = document.getElementById('dialog-confirm-btn');
                const icon = document.getElementById('dialog-icon');

                icon.innerText = "🔑";
                title.innerText = "Admin Authentication";
                msg.innerText = message;
                input.value = "";
                input.classList.remove('hidden');
                if (isPassword) input.type = "password";
                else input.type = "text";
                cancelBtn.classList.remove('hidden');

                container.classList.remove('hidden');
                input.focus();

                function handleConfirm() {
                    const value = input.value;
                    cleanup();
                    resolve(value);
                }
                function handleCancel() {
                    cleanup();
                    resolve(null);
                }
                function cleanup() {
                    confirmBtn.removeEventListener('click', handleConfirm);
                    cancelBtn.removeEventListener('click', handleCancel);
                    container.classList.add('hidden');
                    input.classList.add('hidden');
                }

                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        function customConfirm(message) {
            return new Promise((resolve) => {
                const container = document.getElementById('custom-dialog-container');
                const title = document.getElementById('dialog-title');
                const msg = document.getElementById('dialog-message');
                const cancelBtn = document.getElementById('dialog-cancel-btn');
                const confirmBtn = document.getElementById('dialog-confirm-btn');
                const icon = document.getElementById('dialog-icon');

                icon.innerText = "⚠️";
                title.innerText = "Please Confirm";
                msg.innerText = message;
                cancelBtn.classList.remove('hidden');

                container.classList.remove('hidden');

                function handleConfirm() {
                    cleanup();
                    resolve(true);
                }
                function handleCancel() {
                    cleanup();
                    resolve(false);
                }
                function cleanup() {
                    confirmBtn.removeEventListener('click', handleConfirm);
                    cancelBtn.removeEventListener('click', handleCancel);
                    container.classList.add('hidden');
                }

                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        function customAlert(message) {
            return new Promise((resolve) => {
                const container = document.getElementById('custom-dialog-container');
                const title = document.getElementById('dialog-title');
                const msg = document.getElementById('dialog-message');
                const cancelBtn = document.getElementById('dialog-cancel-btn');
                const confirmBtn = document.getElementById('dialog-confirm-btn');
                const icon = document.getElementById('dialog-icon');

                icon.innerText = "❌";
                title.innerText = "Access Denied";
                msg.innerText = message;
                cancelBtn.classList.add('hidden');

                container.classList.remove('hidden');

                function handleConfirm() {
                    cleanup();
                    resolve();
                }
                function cleanup() {
                    confirmBtn.removeEventListener('click', handleConfirm);
                    container.classList.add('hidden');
                }

                confirmBtn.addEventListener('click', handleConfirm);
            });
        }

        // --- CORE FUNCTIONS ---
        function init() {
            populateForm();
            renderFilters();
            renderRoutine();
            
            document.getElementById('routine-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newItem = { id: Date.now(), day: document.getElementById('f-day').value, time: document.getElementById('f-time').value, course: document.getElementById('f-course').value.toUpperCase(), section: document.getElementById('f-section').value, teacher: document.getElementById('f-teacher').value, room: document.getElementById('f-room').value, type: document.getElementById('f-type').value };
                routine.push(newItem);
                save(); renderRoutine(); e.target.reset(); showToast("Slot added!");
            });
        }

        function populateForm() {
            const d = document.getElementById('f-day'); const t = document.getElementById('f-time'); const s = document.getElementById('f-section'); const tea = document.getElementById('f-teacher');
            DAYS.forEach(day => d.innerHTML += `<option value="${day}">${day}</option>`);
            TIMES.forEach(time => t.innerHTML += `<option value="${time}">${time}</option>`);
            SECTIONS.forEach(sec => s.innerHTML += `<option value="${sec}">${sec}</option>`);
            Object.keys(TEACHERS).sort().forEach(key => tea.innerHTML += `<option value="${key}">${key} - ${TEACHERS[key]}</option>`);
        }

        function openAdminPanel() { document.getElementById('admin-modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        function closeAdminPanel() { document.getElementById('admin-modal').classList.add('hidden'); document.body.style.overflow = 'auto'; }

        async function handleAdminAuth() {
            const btn = document.getElementById('admin-toggle-btn');
            const editorBtn = document.getElementById('open-editor-btn');
            if (!isAdmin) {
                const pass = await customPrompt("Security Key Required:");
                if (pass === "eee2026") {
                    isAdmin = true; editorBtn.classList.remove('hidden'); document.getElementById('login-text').innerText = "🔓 Logout";
                    btn.classList.replace('bg-slate-900/90', 'bg-rose-600'); btn.classList.replace('text-slate-400', 'text-white');
                    renderRoutine(); showToast("Logged In");
                } else if (pass !== null) { 
                    await customAlert("Access Denied! Incorrect Key."); 
                }
            } else {
                isAdmin = false; editorBtn.classList.add('hidden'); closeAdminPanel();
                document.getElementById('login-text').innerText = "🔒 Admin Login";
                btn.classList.replace('bg-rose-600', 'bg-slate-900/90'); btn.classList.replace('text-white', 'text-slate-400');
                renderRoutine();
            }
        }

        async function deleteItem(id) { 
            if(await customConfirm("Are you sure you want to delete this routine slot?")) { 
                routine = routine.filter(i => i.id !== id); 
                save(); 
                renderRoutine(); 
                showToast("Removed"); 
            } 
        }
        
        async function clearRoutine() { 
            if(await customConfirm("Clear all schedule data? This cannot be undone.")) { 
                routine = []; 
                save(); 
                renderRoutine(); 
                showToast("Cleared"); 
            } 
        }

        function save() { localStorage.setItem('eee_v6_data', JSON.stringify(routine)); }

        function renderFilters() {
            const dWrap = document.getElementById('day-filters'); const sWrap = document.getElementById('section-filters');
            dWrap.innerHTML = ''; DAYS.forEach(d => {
                const isActive = d === activeDay;
                dWrap.innerHTML += `<button onclick="setFilter('day', '${d}')" class="px-4 py-2 rounded-xl text-[10px] font-bold border transition ${isActive ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg' : 'bg-slate-950 border-slate-800 text-slate-500 hover:bg-slate-800'}">${d}</button>`;
            });
            sWrap.innerHTML = ''; SECTIONS.forEach(s => {
                const isActive = s === activeSection;
                sWrap.innerHTML += `<button onclick="setFilter('sec', '${s}')" class="px-4 py-2 rounded-xl text-[10px] font-bold border transition ${isActive ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg' : 'bg-slate-950 border-slate-800 text-slate-500 hover:bg-slate-800'}">${s}</button>`;
            });
        }

        function setFilter(type, val) { if(type === 'day') activeDay = val; else activeSection = val; renderFilters(); renderRoutine(); }

        function renderRoutine() {
            const cont = document.getElementById('routine-container'); cont.innerHTML = '';
            const filtered = routine.filter(i => i.day === activeDay && i.section === activeSection).sort((a,b) => TIMES.indexOf(a.time) - TIMES.indexOf(b.time));

            if (filtered.length === 0) {
                cont.innerHTML = `<div class="text-center py-32 bg-slate-900/40 rounded-3xl border border-dashed border-slate-800 animate-fade-in"><p class="text-slate-600 text-[10px] font-bold uppercase tracking-widest">Empty Schedule for ${activeDay}</p></div>`;
                return;
            }

            const grid = document.createElement('div'); grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in";
            filtered.forEach(c => {
                grid.innerHTML += `<div class="bg-slate-900 border ${c.type === 'Lab' ? 'border-amber-500/30' : 'border-indigo-500/30'} p-6 rounded-3xl relative hover:translate-y-[-4px] transition-all shadow-xl"><div class="flex justify-between items-center mb-5"><span class="text-[9px] font-black px-2.5 py-0.5 rounded-full uppercase border ${c.type === 'Lab' ? 'border-amber-500/40 text-amber-500' : 'border-indigo-500/40 text-indigo-400'}">${c.type}</span><p class="text-[11px] text-slate-500 font-black">🕒 ${c.time}</p></div><h4 class="text-xl font-black text-white mb-6 leading-tight">${c.course}</h4><div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/50 space-y-2"><p class="text-xs text-white font-bold">👤 ${c.teacher} <span class="text-[9px] text-slate-600 font-normal block mt-0.5">${TEACHERS[c.teacher] || ''}</span></p><p class="text-xs text-slate-400 font-bold">📍 Room: ${c.room}</p></div>${isAdmin ? `<button onclick="deleteItem(${c.id})" class="mt-4 w-full py-2 bg-rose-900/20 text-rose-500 text-[10px] font-bold rounded-xl border border-rose-900/30 hover:bg-rose-900/40 transition">Delete</button>` : ''}</div>`;
            });
            cont.appendChild(grid);
        }

        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.transform = "translateX(0)"; setTimeout(() => { t.style.transform = "translateX(150%)"; }, 3000); }
        
        function copyData() { 
            // Reliable fallback text copying for iframe constraints
            const textToCopy = JSON.stringify(routine, null, 2);
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            try {
                document.execCommand('copy');
                showToast("Copied Code!");
            } catch (err) {
                showToast("Failed to copy automatically.");
            }
            document.body.removeChild(tempTextArea);
        }

        init();
    </script>
</body>
</html>

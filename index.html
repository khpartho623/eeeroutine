<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE 262 | Clean Routine Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @media print { .print-hidden { display: none !important; } body { background: white; color: black; } }
        #action-bar { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-[110] transform translate-x-full transition-transform duration-300 bg-indigo-600 text-white px-6 py-3 rounded-xl shadow-2xl text-xs font-bold pointer-events-none"></div>

    <!-- Header -->
    <header class="relative bg-gradient-to-r from-indigo-950 via-slate-900 to-slate-950 border-b border-indigo-950 px-4 py-10 sm:px-8 shadow-2xl print-hidden">
        <div class="relative max-w-7xl mx-auto text-center md:text-left">
            <div class="inline-flex items-center space-x-2 bg-indigo-500/10 border border-indigo-400/20 px-3.5 py-1 rounded-full text-indigo-300 text-[10px] font-bold uppercase tracking-widest mb-3">
                ⚡ EEE 262 BATCH
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">EEE Routine Portal</h1>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6 flex-grow pb-24">
        <!-- NAVIGATION FILTERS -->
        <section class="bg-slate-900 border border-slate-900 rounded-3xl shadow-xl p-6 space-y-6 print-hidden">
            <div>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-3">📅 Select Weekday:</span>
                <div id="day-filters" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="pt-6 border-t border-slate-800">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-3">👥 Select Section:</span>
                <div id="section-filters" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <!-- ROUTINE DISPLAY -->
        <div id="routine-container"></div>
    </main>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 z-[100] hidden bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 print-hidden">
        <div class="bg-slate-900 border border-indigo-500/30 rounded-3xl w-full max-w-4xl p-6 shadow-2xl overflow-y-auto max-h-[90vh] animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-indigo-400">🛠️ Editor Dashboard</h2>
                <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <form id="routine-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <select id="f-day" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <select id="f-time" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <select id="f-section" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <select id="f-teacher" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required></select>
                <input id="f-room" type="text" placeholder="Room Number" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500" required>
                <select id="f-type" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:ring-1 ring-indigo-500">
                    <option value="Theory">Theory Class</option>
                    <option value="Lab">Lab Practical</option>
                </select>
                <button type="submit" class="bg-emerald-600 text-white font-bold rounded-xl py-3 shadow-lg hover:bg-emerald-500 transition">Add Slot</button>
            </form>
            <div class="pt-6 border-t border-slate-800">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Backup & Data Tools</h3>
                <div class="flex flex-wrap gap-4">
                    <button onclick="copyData()" class="bg-indigo-950/40 border border-indigo-900 hover:bg-indigo-900/40 text-indigo-400 text-[10px] font-bold uppercase px-4 py-2.5 rounded-xl transition">📋 Copy Backup Code</button>
                    <button onclick="importDataPrompt()" class="bg-indigo-950/40 border border-indigo-900 hover:bg-indigo-900/40 text-indigo-400 text-[10px] font-bold uppercase px-4 py-2.5 rounded-xl transition">📥 Import Backup Code</button>
                    <button onclick="clearRoutine()" class="text-rose-400 hover:text-rose-300 text-[10px] font-bold uppercase px-4 py-2.5">🗑️ Erase All Data</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CUSTOM DIALOG MODAL -->
    <div id="custom-dialog-container" class="fixed inset-0 z-[200] hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-indigo-500/30 rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center space-y-4 animate-fade-in">
            <div id="dialog-icon" class="text-3xl">🔑</div>
            <h3 id="dialog-title" class="text-md font-bold text-slate-200">System Security</h3>
            <p id="dialog-message" class="text-xs text-slate-400">Please authenticate to continue.</p>
            <input id="dialog-input" type="password" class="hidden w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-center text-white outline-none focus:ring-1 ring-indigo-500 mb-2" placeholder="••••••••">
            <div class="flex gap-3 justify-center">
                <button id="dialog-cancel-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-4 py-2 rounded-xl">Cancel</button>
                <button id="dialog-confirm-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Confirm</button>
            </div>
        </div>
    </div>

    <!-- FLOATING ACTION BAR -->
    <div id="action-bar" class="fixed bottom-0 left-0 w-full p-6 flex justify-center gap-4 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent print-hidden z-[90]">
        <button id="open-editor-btn" onclick="openAdminPanel()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 transition-all">
            <span>➕ Open Editor</span>
        </button>
        <button onclick="handleAdminAuth()" id="admin-toggle-btn" class="bg-slate-900/90 backdrop-blur border border-slate-800 text-slate-400 hover:text-white px-8 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 transition-all">
            <span id="login-text">🔒 Admin Login</span>
        </button>
    </div>

    <footer class="w-full text-center py-6 border-t border-slate-900 text-slate-600 text-xs font-bold tracking-widest uppercase print-hidden mt-auto">
         <p class="text-[10px] text-slate-600 font-bold uppercase tracking-[0.1em]">
             Powered by <a href="https://khpartho623.github.io/me/" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 transition-colors">Md. Kamrul Hasan</a>
         </p>
    </footer>

    <script>
        const DAYS = ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
        const TIMES = ["8:30-9:30", "9:30-10:30", "10:30-11:30", "11:30-12:30", "1:00-2:00", "2:00-3:00", "3:00-4:00", "4:00-5:00", "5:00-6:00"];
        const SECTIONS = ["1-1 A", "1-1 B", "1-1 C", "1-1 D", "1-1 E", "1-1 F"];
        const TEACHERS = { MSA: "Dr. M. Shamsul Alam", MRK: "Dr. Mohammad Rezaul Karim", DAM: "Dr. Md. Alam Hossain Mondal", MFI: "Dr. Md. Fokhrul Islam", DAS: "Md. Dara Abdus Satter", DRA: "Dr. Md. Rezwanul Ahsan", SRC: "Dr. Srimanti Roy Choudhury", DTF: "Dr. Tama Fouzder", FHT: "Dr. Fahmida Hossain Tithi", MAH: "Dr. Md. Ashraful Haque", SR: "Md. Sohel Rana", SD: "Sutapa Debnath", MR: "Md. Rokanuzzaman", MSH: "Md. Sanowar Hosen", MRA: "Md. Ramjan Ali", NR: "Naimur Rahman", SH: "Sagor Hazra", SRH: "Syeda Rukaiya Hossain", SDN: "Sujoy Devnath", SAT: "Mir Sabrina Alam", MNA: "Musanna Afrin", AI: "Ahmed Imtiaz", PA: "Pritom Aich", HRP: "Md. Hasibur Rahaman Peash", RP: "Md. Rasel Parvez", NH: "Nayeb Hasin", AKB: "Anjan Kumar Bagchi", SP: "Sudipto Pramanik", BS: "Bijoy Sorker", IJM: "Isfat Jahan Maria", TRS: "Tara Rani Sarkar", SS: "Sarna Sarker", JA: "Junayed Ahmmad", DB: "Diponkar Bhowmik", KMT: "Kazi Mubashir Tazwar", TA: "Tousif Ansari", KNA: "Khondaker Nafis Ahmed", AAA: "Anan Afsana Azad", MMR: "Md. Mahtabur Rahman", ZK: "Md. Zakaria Khan", ShA: "Dr. Md. Shahin Azad", SHS: "Sayeed Hossain Sayor", SMP: "Sumaiya Parvin", AB: "Anik Biswas", RIR: "Md. Rakibul Islam Rakib", SKS: "Safia Khan Sara", MW: "Md. Wahiduzzaman", JMT: "Juhayer Mahtab Tasin", SkH: "Mohammad Sakib Hossain", MAR: "Maksuda Akter Rubi", MTC: "Maliha Taslima Chowdhury", AS: "Abhirup Sarker" };

        let isAdmin = false;
        let activeDay = "Saturday";
        let activeSection = "1-1 A";

        const defaultRoutineData = [
          // Section A, B, C, D omitted for space, but Section F fully updated below
          { id: 100, day: "Saturday", time: "8:30-9:30", section: "1-1 F", teacher: "TRS", room: "103", type: "Theory" },
          { id: 101, day: "Saturday", time: "9:30-10:30", section: "1-1 F", teacher: "SS", room: "103", type: "Theory" },
          { id: 102, day: "Sunday", time: "10:30-11:30", section: "1-1 F", teacher: "TRS", room: "306", type: "Theory" },
          { id: 103, day: "Sunday", time: "1:00-2:00", section: "1-1 F", teacher: "MMR", room: "305", type: "Theory" },
          { id: 104, day: "Sunday", time: "2:00-3:00", section: "1-1 F", teacher: "SS", room: "305", type: "Theory" },
          { id: 105, day: "Sunday", time: "3:00-4:00", section: "1-1 F", teacher: "KMT", room: "305", type: "Theory" },
          { id: 106, day: "Tuesday", time: "8:30-9:30", section: "1-1 F", teacher: "MMR", room: "404", type: "Theory" },
          { id: 107, day: "Tuesday", time: "9:30-10:30", section: "1-1 F", teacher: "TRS", room: "404", type: "Theory" },
          { id: 108, day: "Tuesday", time: "10:30-11:30", section: "1-1 F", teacher: "SS", room: "404", type: "Theory" },
          { id: 109, day: "Tuesday", time: "11:30-12:30", section: "1-1 F", teacher: "KMT", room: "404", type: "Theory" },
          
          // --- UPDATED WEDNESDAY SLOTS FOR F ---
          { id: 1779470602389, day: "Wednesday", time: "8:30-9:30", section: "1-1 F", teacher: "MMR", room: "303", type: "Theory" },
          { id: 1779470602388, day: "Wednesday", time: "9:30-10:30", section: "1-1 F", teacher: "KMT", room: "303", type: "Theory" },
          { id: 1779470383823, day: "Wednesday", time: "10:30-11:30", section: "1-1 F", teacher: "MR", room: "102 F2", type: "Lab" },
          { id: 1779470400230, day: "Wednesday", time: "11:30-12:30", section: "1-1 F", teacher: "MR", room: "102 F2", type: "Lab" },
          { id: 1779470423189, day: "Wednesday", time: "10:30-11:30", section: "1-1 F", teacher: "ZK", room: "AB-2 301 F1", type: "Lab" },
          { id: 1779470436956, day: "Wednesday", time: "11:30-12:30", section: "1-1 F", teacher: "ZK", room: "AB-2 301 F1", type: "Lab" }
        ];

        let routine = JSON.parse(localStorage.getItem('eee_v20_data')) || defaultRoutineData;

        // Force reset to new data if version doesn't match
        if (!localStorage.getItem('eee_v20_init')) {
            routine = defaultRoutineData;
            localStorage.setItem('eee_v20_data', JSON.stringify(routine));
            localStorage.setItem('eee_v20_init', 'true');
        }

        function init() {
            populateForm();
            renderFilters();
            renderRoutine();
            document.getElementById('routine-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newItem = { id: Date.now(), day: document.getElementById('f-day').value, time: document.getElementById('f-time').value, section: document.getElementById('f-section').value, teacher: document.getElementById('f-teacher').value, room: document.getElementById('f-room').value, type: document.getElementById('f-type').value };
                routine.push(newItem);
                save(); renderRoutine(); e.target.reset(); showToast("Slot added!");
            });
        }

        function populateForm() {
            const d = document.getElementById('f-day'), t = document.getElementById('f-time'), s = document.getElementById('f-section'), tea = document.getElementById('f-teacher');
            DAYS.forEach(day => d.innerHTML += `<option value="${day}">${day}</option>`);
            TIMES.forEach(time => t.innerHTML += `<option value="${time}">${time}</option>`);
            SECTIONS.forEach(sec => s.innerHTML += `<option value="${sec}">${sec}</option>`);
            Object.keys(TEACHERS).sort().forEach(key => tea.innerHTML += `<option value="${key}">${key} - ${TEACHERS[key]}</option>`);
        }

        function setFilter(type, val) { 
            if(type === 'day') activeDay = val; else activeSection = val; 
            renderFilters(); renderRoutine(); 
        }

        function renderFilters() {
            const dWrap = document.getElementById('day-filters'), sWrap = document.getElementById('section-filters');
            dWrap.innerHTML = ''; DAYS.forEach(d => {
                dWrap.innerHTML += `<button onclick="setFilter('day', '${d}')" class="px-4 py-2 rounded-xl text-[10px] font-bold border transition ${d === activeDay ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg' : 'bg-slate-950 border-slate-800 text-slate-500 hover:bg-slate-800'}">${d}</button>`;
            });
            sWrap.innerHTML = ''; SECTIONS.forEach(s => {
                sWrap.innerHTML += `<button onclick="setFilter('sec', '${s}')" class="px-4 py-2 rounded-xl text-[10px] font-bold border transition ${s === activeSection ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg' : 'bg-slate-950 border-slate-800 text-slate-500 hover:bg-slate-800'}">${s}</button>`;
            });
        }

        function renderRoutine() {
            const cont = document.getElementById('routine-container'); cont.innerHTML = '';
            const filtered = routine.filter(i => i.day === activeDay && i.section === activeSection).sort((a,b) => TIMES.indexOf(a.time) - TIMES.indexOf(b.time));
            if (filtered.length === 0) {
                cont.innerHTML = `<div class="text-center py-32 bg-slate-900/40 rounded-3xl border border-dashed border-slate-800 animate-fade-in"><p class="text-slate-600 text-[10px] font-bold uppercase tracking-widest">No classes on ${activeDay} for ${activeSection}</p></div>`;
                return;
            }
            const grid = document.createElement('div'); grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in";
            filtered.forEach(c => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border ${c.type === 'Lab' ? 'border-amber-500/30' : 'border-indigo-500/30'} p-6 rounded-3xl relative shadow-xl">
                        <div class="flex justify-between items-center mb-5">
                            <span class="text-[9px] font-black px-2.5 py-0.5 rounded-full uppercase border ${c.type === 'Lab' ? 'border-amber-500/40 text-amber-500' : 'border-indigo-500/40 text-indigo-400'}">${c.type}</span>
                            <p class="text-[11px] text-slate-500 font-black">🕒 ${c.time}</p>
                        </div>
                        <h4 class="text-xl font-black text-white mb-6 leading-tight">${TEACHERS[c.teacher] || c.teacher}</h4>
                        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/50 space-y-2">
                            <p class="text-xs text-indigo-400 font-bold">👤 Teacher: ${c.teacher}</p>
                            <p class="text-xs text-slate-400 font-bold">📍 Room: ${c.room}</p>
                        </div>
                        ${isAdmin ? `<button onclick="deleteItem(${c.id})" class="mt-4 w-full py-2 bg-rose-900/20 text-rose-500 text-[10px] font-bold rounded-xl border border-rose-900/30 hover:bg-rose-900/40 transition">Delete</button>` : ''}
                    </div>`;
            });
            cont.appendChild(grid);
        }

        async function handleAdminAuth() {
            const btn = document.getElementById('admin-toggle-btn'), editorBtn = document.getElementById('open-editor-btn');
            if (!isAdmin) {
                const pass = await customPrompt("Enter Key (eee2026):", true);
                if (pass === "eee2026") {
                    isAdmin = true; editorBtn.classList.remove('hidden'); 
                    document.getElementById('login-text').innerText = "🔓 Logout";
                    btn.classList.replace('bg-slate-900/90', 'bg-rose-600'); renderRoutine(); showToast("Admin Mode ON");
                } else if (pass !== null) { await customAlert("Access Denied!"); }
            } else {
                isAdmin = false; editorBtn.classList.add('hidden'); closeAdminPanel();
                document.getElementById('login-text').innerText = "🔒 Admin Login";
                btn.classList.replace('bg-rose-600', 'bg-slate-900/90'); renderRoutine();
            }
        }

        function save() { localStorage.setItem('eee_v20_data', JSON.stringify(routine)); }
        function openAdminPanel() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminPanel() { document.getElementById('admin-modal').classList.add('hidden'); }
        async function deleteItem(id) { if(await customConfirm("Delete this?")) { routine = routine.filter(i => i.id !== id); save(); renderRoutine(); } }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.transform = "translateX(0)"; setTimeout(() => t.style.transform = "translateX(150%)", 3000); }

        function customPrompt(m, p=false) {
            return new Promise(resolve => {
                const c = document.getElementById('custom-dialog-container'), i = document.getElementById('dialog-input');
                document.getElementById('dialog-message').innerText = m;
                i.classList.remove('hidden'); i.type = p ? "password" : "text"; i.value = ""; c.classList.remove('hidden');
                document.getElementById('dialog-confirm-btn').onclick = () => { c.classList.add('hidden'); resolve(i.value); };
                document.getElementById('dialog-cancel-btn').onclick = () => { c.classList.add('hidden'); resolve(null); };
            });
        }
        function customConfirm(m) {
            return new Promise(resolve => {
                const c = document.getElementById('custom-dialog-container');
                document.getElementById('dialog-message').innerText = m;
                document.getElementById('dialog-input').classList.add('hidden'); c.classList.remove('hidden');
                document.getElementById('dialog-confirm-btn').onclick = () => { c.classList.add('hidden'); resolve(true); };
                document.getElementById('dialog-cancel-btn').onclick = () => { c.classList.add('hidden'); resolve(false); };
            });
        }
        function customAlert(m) {
            return new Promise(resolve => {
                const c = document.getElementById('custom-dialog-container');
                document.getElementById('dialog-message').innerText = m;
                document.getElementById('dialog-input').classList.add('hidden'); c.classList.remove('hidden');
                document.getElementById('dialog-confirm-btn').onclick = () => { c.classList.add('hidden'); resolve(); };
            });
        }

        init();
    </script>
</body>
</html>
